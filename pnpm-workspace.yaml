packages:
  - apps/*
  - packages/*

# Project policy; framework-specific toolchains keep separate catalogs.
catalog:
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  tailwindcss: ^4.1.0
  '@tailwindcss/vite': ^4.1.0
  oxlint: ^1.81.0
  eslint: ^9
  '@eslint/js': ^9
  shadcn: 4.21.4

catalogs:
  next:
    typescript: ^5
    '@types/node': ^20
  vite:
    typescript: ~6.0.2
    '@types/node': ^24.13.3

engineStrict: true
verifyDepsBeforeRun: false

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@types/chrome@0.3.5'

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
