name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Run check
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              line=${line//$'\n'/'%0A'}
              printf '::error title=pnpm check::%s\n' "$line"
            done < <(tail -n 80 check.log)
            exit "$status"
          fi
      - run: pnpm audit:security

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The runner derives expected instances from the checked registry and
      # fails on missing, duplicate, skipped or stale per-instance reports.
      - run: pnpm test:browser
      - name: Report browser verification failures
        if: ${{ failure() }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from "node:fs/promises"
          import { join, relative } from "node:path"

          async function reports(directory) {
            const result = []
            for (const entry of await readdir(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name)
              if (entry.isDirectory()) result.push(...(await reports(path)))
              else if (entry.isFile() && entry.name === "report.json") result.push(path)
            }
            return result
          }

          for (const path of await reports(".reinit/verification")) {
            const report = JSON.parse(await readFile(path, "utf8"))
            if (report.status === "passed") continue
            const detail = String(report.failure ?? `${report.appId ?? "suite"}: ${report.status}`)
              .replace(/\r?\n/g, " ")
              .replace(/%/g, "%25")
              .replace(/\r/g, "%0D")
              .replace(/\n/g, "%0A")
            console.log(`::error file=${relative(".", path)}::${detail}`)
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          include-hidden-files: true
          path: |
            .reinit/verification/browser-*/report.json
            .reinit/verification/browser-*/*.log
            .reinit/verification/browser-*/*.jsonl
            .reinit/verification/browser-*/*/report.json
            .reinit/verification/browser-*/*/*.log
            .reinit/verification/browser-*/*/*.png
            .reinit/verification/browser-*/*/*.jsonl
          if-no-files-found: error
          retention-days: 7
