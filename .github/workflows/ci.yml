name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit:security

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The runner derives expected instances from the checked registry and
      # fails on missing, duplicate, skipped or stale per-instance reports.
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-verification
          include-hidden-files: true
          path: |
            .reinit/verification/browser-*/report.json
            .reinit/verification/browser-*/*.log
            .reinit/verification/browser-*/*/report.json
            .reinit/verification/browser-*/*/*.log
            .reinit/verification/browser-*/*/*.png
          if-no-files-found: error
          retention-days: 7
